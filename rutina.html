<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina - PhysioMotion 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script para habilitar el modelo 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
    <div class="app-container">
        <a href="dashboard.html" class="back-btn">⬅ Volver</a>
        
        <!-- Visor 3D -->
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="Modelo 3D"
            camera-controls auto-rotate>
        </model-viewer>

        <div class="detalles-rutina">
            <h2>Sentadilla a Silla</h2>
            <p><strong>Objetivo:</strong> Fuerza funcional de miembros inferiores</p>
            
            <div class="stats">
                <div class="stat-box">Series: 2</div>
                <div class="stat-box">Reps: 8</div>
            </div>
            
            <div class="timer">
                <p>Descanso: 60s</p>
                <h3>00:60</h3>
            </div>

            <a href="#" class="btn-primary" onclick="alert('¡Sesión registrada!')">FINALIZAR Y GUARDAR</a>
        </div>
    </div>
</body>
</html>
